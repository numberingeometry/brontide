# Portable environment for the pipeline and its CPU verification tools.
# GPU embedding requires a torch build compatible with the available CUDA runtime.
# Create with: conda env create -f environment.yml
# Then activate brontide and install the appropriate torch wheel if GPU support is needed.
name: brontide
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - pyarrow            # parquet
  - scikit-learn       # MiniBatchKMeans (PCA is exact, in numpy/scipy)
  - scipy              # Ward linkage / dendrogram
  - matplotlib
  - tqdm
  - pip
  - pip:
      - umap-learn
      - statsforecast        # Nixtla — Naive/SeasonalNaive/AutoETS/AutoARIMA/AutoTheta
      - torch                # install a compatible CUDA build when GPU embedding is needed
      - transformers
      - adapters             # SPECTER2 proximity adapter (allenai/specter2)
      - kagglehub            # arXiv Kaggle snapshot download
      - -e .
