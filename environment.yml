# Conda environment for lacuna. Matches arxiv-heatmap's conda lineage; conda-first
# because the compute host installs CUDA torch here (most robust on Windows).
#
#   conda env create -f environment.yml
#   conda activate lacuna
#   pip install -e .            # makes `import lacuna` work
#
# GPU note (compute host): the pip `torch` below is CPU/default. On the compute host, after creating
# the env, install the CUDA build explicitly, e.g.:
#   pip install torch --index-url https://download.pytorch.org/whl/cu124
# The CPU-only environment only ever runs `--sample` smoke tests, so CPU torch is fine there.
name: lacuna
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - pyarrow            # parquet
  - scikit-learn       # IncrementalPCA, MiniBatchKMeans
  - scipy              # Ward linkage / dendrogram
  - matplotlib
  - tqdm
  - pip
  - pip:
      - umap-learn
      - statsforecast        # Nixtla — Naive/SeasonalNaive/AutoETS/AutoARIMA/AutoTheta
      - torch                # CPU default; compute host overrides with the CUDA wheel (see note above)
      - transformers
      - adapters             # SPECTER2 proximity adapter (allenai/specter2)
      - kagglehub            # arXiv Kaggle snapshot download
      - -e .
