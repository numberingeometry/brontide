name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the public-safety scan reads history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (committed-artifact checks need no GPU and no corpus)
        run: python -m pip install -e .
      - name: Headline - all 18 published rows reproduce exactly
        run: python scripts/verify_results.py
      - name: Selection decomposition (A - Lambda identity)
        run: python scripts/verify_selectionconsistency.py
      - name: Pre-registered follow-ups (novelty skill, interval coverage)
        run: python scripts/verify_coverage.py
      - name: Public-safety scan (working tree and history)
        run: |
          python scripts/check_public_safe.py
          python scripts/check_public_safe.py --history
